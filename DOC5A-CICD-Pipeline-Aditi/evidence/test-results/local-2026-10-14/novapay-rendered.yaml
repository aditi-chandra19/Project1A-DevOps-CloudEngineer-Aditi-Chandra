apiVersion: v1
kind: Service
metadata:
  name: novapay-demo
  labels:
    app.kubernetes.io/name: novapay-demo
    app.kubernetes.io/instance: novapay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: novapay-demo
    app.kubernetes.io/instance: novapay
    app.kubernetes.io/slot: "blue"
  ports:
