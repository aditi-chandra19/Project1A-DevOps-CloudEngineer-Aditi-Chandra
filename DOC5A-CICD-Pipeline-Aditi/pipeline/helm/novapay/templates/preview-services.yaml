{{- $root := . }}
{{- range $color := list "blue" "green" }}
# Check a slot here before switching the stable Service to it.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s-preview" $root.Release.Name $color }}
  labels:
    app.kubernetes.io/name: novapay-demo
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/slot: {{ $color }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: novapay-demo
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/slot: {{ $color }}
  ports:
    - name: http
      port: {{ $root.Values.service.port }}
      targetPort: http
      protocol: TCP
---
{{- end }}
