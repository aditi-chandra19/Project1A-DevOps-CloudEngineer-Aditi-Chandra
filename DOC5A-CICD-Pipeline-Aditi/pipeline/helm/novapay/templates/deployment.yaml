{{- $root := . }}
{{- range $color := list "blue" "green" }}
{{- $image := index $root.Values.images $color }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $root.Release.Name $color }}
  labels:
    app.kubernetes.io/name: novapay-demo
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/slot: {{ $color }}
spec:
  replicas: {{ $root.Values.replicaCount }}
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: novapay-demo
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/slot: {{ $color }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novapay-demo
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/slot: {{ $color }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: novapay-demo
          image: {{ printf "%s@%s" $image.repository (required (printf "set images.%s.digest to the approved SHA-256 digest" $color) $image.digest) | quote }}
          imagePullPolicy: {{ $image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: NOVAPAY_BIND_ADDRESS
              value: "0.0.0.0"
            - name: NOVAPAY_ENVIRONMENT
              value: {{ $root.Release.Namespace | quote }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
{{- end }}
