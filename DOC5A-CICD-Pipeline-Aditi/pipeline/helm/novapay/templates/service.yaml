apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-demo
  labels:
    app.kubernetes.io/name: novapay-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: novapay-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/slot: {{ .Values.activeColor | quote }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
