# Route the stable Service to this slot: blue or green.
activeColor: blue
replicaCount: 2

# Supply approved image digests for both slots before installing the chart.
images:
  blue:
    repository: artifactory.novapay.example/novapay/demo
    digest: ""
    pullPolicy: IfNotPresent
  green:
    repository: artifactory.novapay.example/novapay/demo
    digest: ""
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

terminationGracePeriodSeconds: 45
